<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="epBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1e38" />
      <stop offset="100%" stop-color="#162e56" />
    </linearGradient>
    <linearGradient id="epAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="epGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0c1e38" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect width="48" height="48" rx="13" fill="url(#epBg)" filter="url(#epGlow)" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="12.5" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
  
  <!-- Stylized Phone Outline & Screen -->
  <rect x="9" y="8" width="18" height="32" rx="4.5" fill="#050b14" stroke="url(#epAccent)" stroke-width="1.8" />
  <!-- Dynamic Island / Speaker Pill -->
  <rect x="14.5" y="10.5" width="7" height="2" rx="1" fill="#38bdf8" opacity="0.9" />
  
  <!-- Screen Glow Line -->
  <line x1="12" y1="36" x2="24" y2="36" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  
  <!-- Bold Stylized Letter "P" overlapping phone -->
  <path d="M25 15 H33 C36.5 15 39 17.5 39 21 C39 24.5 36.5 27 33 27 H25 V33" 
        stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Glowing Dot / Sparkle -->
  <circle cx="34" cy="21" r="2" fill="url(#epAccent)" />
</svg>
